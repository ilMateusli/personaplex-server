[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:nginx]
command=nginx -c /app/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:personaplex]
command=/app/moshi/.venv/bin/python -m moshi.server --host 0.0.0.0 --port 8999
directory=/app/moshi
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
startsecs=30
startretries=3

[program:qwen3tts]
command=/app/tts/.venv/bin/python tts_streaming_server.py
directory=/app/tts
environment=HOST="0.0.0.0",PORT="8880",TTS_MODEL_NAME="Qwen/Qwen3-TTS-12Hz-1.7B-Base",TTS_CHUNK_SIZE="2",TTS_PARITY_MODE="true",NVIDIA_VISIBLE_DEVICES="all",PYTHONPATH="/app/tts"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
startsecs=60
startretries=3
