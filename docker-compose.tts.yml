# faster-qwen3-tts Standalone — Voice cloning with CUDA graphs
#
# Usage:
#   docker compose -f docker-compose.tts.yml up --build
#   docker compose -f docker-compose.tts.yml down
#
# Test:
#   curl http://localhost:8880/health

services:
  qwen3-tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    ports:
      - "${TTS_PORT:-8880}:8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - TTS_MODEL_NAME=${TTS_MODEL_NAME:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      - TTS_CHUNK_SIZE=${TTS_CHUNK_SIZE:-8}
      - TTS_PARITY_MODE=${TTS_PARITY_MODE:-true}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3

volumes:
  huggingface_cache:
